name: Update Voicebank Form

on:
  push:
    paths:
      - "characters/**"
      - "characters/index.json"
      - ".github/ISSUE_TEMPLATE/create_voicebank_template.yml"
      - "scripts/generate_voicebank_form.py"

jobs:
  generate-form:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate form
        run: python scripts/generate_voicebank_form.py

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .github/ISSUE_TEMPLATE/create_voicebank.yml
          git commit -m "Auto-update voicebank form" || echo "No changes"
          git push
