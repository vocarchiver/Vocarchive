name: Update Character Form

on:
  push:
    paths:
      - "characters/**"
      - ".github/ISSUE_TEMPLATE/create_character_template.yml"
      - "scripts/generate_character_form.py"

jobs:
  generate-form:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install boto3
        run: pip install boto3

      - name: Generate dynamic form
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
        run: python scripts/generate_character_form.py

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .github/ISSUE_TEMPLATE/create_character.yml
          git commit -m "Auto-update character form" || echo "No changes"
          git push
